<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>系统主要业务流程图</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white flex items-center justify-center min-h-screen p-8 font-sans">

    <div class="border-2 border-gray-300 p-8 flex flex-row items-stretch justify-center gap-6 rounded-xl shadow-lg bg-gray-50 max-w-6xl w-full">
        
        <div class="flex flex-col items-center justify-center w-64 border-2 border-blue-500 bg-blue-50 rounded-lg p-5 shadow-sm relative">
            <div class="text-xl font-bold text-blue-700 mb-4 border-b-2 border-blue-200 pb-2 w-full text-center">
                📱 移动客户端
            </div>
            <div class="bg-white border-2 border-blue-400 rounded-lg w-full p-4 text-center shadow-sm">
                <div class="font-bold text-gray-800 mb-3">前端界面 (Vue.js 3)</div>
                <div class="text-sm text-gray-600 space-y-2 text-left inline-block">
                    <p class="flex items-center">✅ <span class="ml-2">扫码点餐</span></p>
                    <p class="flex items-center">✅ <span class="ml-2">账单查看</span></p>
                    <p class="flex items-center">✅ <span class="ml-2">呼叫服务</span></p>
                </div>
            </div>
        </div>

        <div class="flex flex-col items-center justify-center w-28 relative">
            <div class="w-full h-1 bg-gray-400 relative">
                <div class="absolute left-0 top-1/2 transform -translate-y-1/2 -translate-x-1 border-t-4 border-b-4 border-r-8 border-transparent border-r-gray-400"></div>
                <div class="absolute right-0 top-1/2 transform -translate-y-1/2 translate-x-1 border-t-4 border-b-4 border-l-8 border-transparent border-l-gray-400"></div>
            </div>
            <div class="absolute -top-6 text-xs font-bold text-blue-600 whitespace-nowrap bg-gray-50 px-1">HTTP / REST API</div>
            <div class="absolute top-4 text-xs font-bold text-gray-500 whitespace-nowrap bg-gray-50 px-1">双向数据通信</div>
        </div>

        <div class="flex flex-col items-center w-[480px] border-2 border-purple-500 bg-purple-50 rounded-lg p-6 shadow-sm relative">
            <div class="text-xl font-bold text-purple-700 mb-6 border-b-2 border-purple-200 pb-2 w-full text-center">
                💻 Windows 11 PC 主机
            </div>
            
            <div class="w-full bg-white border-2 border-indigo-400 rounded-lg p-4 mb-4 text-center shadow-sm">
                <div class="font-bold text-gray-800">Django Web 后端程序</div>
                <div class="text-xs text-gray-500 mt-1">基础业务逻辑 / 权限校验 / API 数据服务</div>
            </div>

            <div class="flex w-full gap-4 mb-4">
                <div class="flex-1 bg-white border-2 border-teal-400 rounded-lg p-4 text-center shadow-sm">
                    <div class="font-bold text-gray-800">数据大屏模块</div>
                    <div class="text-xs text-gray-500 mt-1">ECharts 可视化渲染</div>
                </div>
                <div class="flex-1 bg-white border-2 border-red-400 rounded-lg p-4 text-center shadow-sm relative overflow-hidden">
                    <div class="absolute top-0 right-0 bg-red-500 text-white text-[10px] px-2 py-0.5 rounded-bl-lg">核心亮点</div>
                    <div class="font-bold text-gray-800 mt-1">AI 预测模块</div>
                    <div class="text-xs text-gray-500 mt-1">Pandas + Sklearn</div>
                </div>
            </div>

            <div class="w-full bg-white border-2 border-green-500 rounded-lg p-4 text-center shadow-sm relative">
                <div class="font-bold text-gray-800">🗄️ MySQL 8.0 数据库</div>
                <div class="text-xs text-gray-500 mt-1">持久化存储超 1.5 万条测试订单流水</div>
                
                <div class="absolute -top-3 left-1/2 transform -translate-x-1/2 flex items-center justify-center">
                    <div class="h-4 w-0.5 bg-gray-400"></div>
                </div>
            </div>
        </div>

        <div class="flex flex-col items-center justify-center w-28 relative">
            <div class="w-full h-1 bg-gray-400 relative">
                <div class="absolute right-0 top-1/2 transform -translate-y-1/2 translate-x-1 border-t-4 border-b-4 border-l-8 border-transparent border-l-gray-400"></div>
            </div>
            <div class="absolute -top-6 text-xs font-bold text-orange-600 whitespace-nowrap bg-gray-50 px-1">打印指令下发</div>
            <div class="absolute top-4 text-xs font-bold text-gray-500 whitespace-nowrap bg-gray-50 px-1">蓝牙 / USB 传输</div>
        </div>

        <div class="flex flex-col items-center justify-center w-64 border-2 border-orange-500 bg-orange-50 rounded-lg p-5 shadow-sm relative">
            <div class="text-xl font-bold text-orange-700 mb-4 border-b-2 border-orange-200 pb-2 w-full text-center">
                🖨️ 外接设备
            </div>
            <div class="bg-white border-2 border-orange-400 rounded-lg w-full p-4 text-center shadow-sm">
                <div class="font-bold text-gray-800 mb-3">物理后厨打印机</div>
                <div class="text-sm text-gray-600 space-y-2 text-center">
                    <p class="bg-gray-100 rounded py-1">⬇️ 接收预测数据</p>
                    <p class="bg-gray-100 rounded py-1">📄 输出纸质备货单</p>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
