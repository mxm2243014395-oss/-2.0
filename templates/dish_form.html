<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - 智慧餐厅</title>
    <style>
        :root{--bg:#F5F5F7;--card:#fff;--text:#1D1D1F;--sub:#6E6E73;--line:rgba(0,0,0,.06);--shadow:0 4px 6px -1px rgba(0,0,0,.05)}
        *{box-sizing:border-box} body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
        .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px}.card{width:min(860px,100%);background:#fff;border-radius:22px;box-shadow:var(--shadow);overflow:hidden}.head{padding:22px 24px;border-bottom:1px solid var(--line)}.head h1{margin:0;font-size:28px;letter-spacing:-.03em;font-weight:700}.body{padding:24px}.field{margin-bottom:18px}.field label{display:block;margin-bottom:8px;font-size:13px;font-weight:600;color:var(--sub)}.field input,.field textarea,.field select{width:100%;border:none;border-bottom:1px solid rgba(0,0,0,.08);border-radius:10px 10px 0 0;background:#fff;padding:12px 6px;font-size:15px;outline:none;transition:.18s ease, box-shadow .18s ease}.field input:focus,.field textarea:focus,.field select:focus{border-bottom-color:rgba(0,0,0,.22);box-shadow:0 8px 22px rgba(0,0,0,.05)}.actions{display:flex;justify-content:flex-end;gap:12px;margin-top:22px}.btn-save{background:#000;color:#fff;border:none;border-radius:999px;padding:12px 18px;font-weight:600}.btn-save:hover{color:#fff;opacity:.94}.btn-cancel{background:#f2f2f7;color:#1D1D1F;border:none;border-radius:999px;padding:12px 18px;font-weight:600}.btn-cancel:hover{background:#e9e9ee;color:#000}
    </style>
</head>
<body>
<div class="wrap">
    <div class="card">
        <div class="head"><h1>{{ title }}</h1></div>
        <div class="body">
            <form method="post">
                {% csrf_token %}
                {% for field in form %}
                <div class="field">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% if field.name == 'price' %}<div style="font-size:12px;color:var(--sub);margin-top:6px;">请输入菜品单价，例如 28.00</div>{% endif %}
                    {% if field.help_text %}<div style="font-size:12px;color:var(--sub);margin-top:6px;">{{ field.help_text }}</div>{% endif %}
                    {% for error in field.errors %}<div class="text-danger small mt-1">{{ error }}</div>{% endfor %}
                </div>
                {% endfor %}
                <div class="actions"><a href="{% url 'dish_list' %}" class="btn-cancel">取消</a><button type="submit" class="btn-save">保存</button></div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
